name: employees

on:
  # On branches, the pull_request trigger covers it; listing push without a
  # branch filter runs both gates twice for every push to an open PR.
  push:
    branches: [main]
    paths: ["employees/**", "scripts/validate_employees.py", "scripts/extract_employee_schemas.py", "scripts/run_all_employees.py"]
  pull_request:
    paths: ["employees/**", "scripts/validate_employees.py", "scripts/extract_employee_schemas.py", "scripts/run_all_employees.py"]

jobs:
  employee-specs:
    name: Employee specifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Specifications conform to the fourteen-section contract
        run: python scripts/validate_employees.py

      - name: Extracted schemas match their specifications
        run: python scripts/extract_employee_schemas.py --check

      - name: Shared loop behaves as specified
        run: python -m unittest discover -s employees/core/tests -t . -v

      # The checks above read the specifications. This one runs the code, so a
      # schema change the extractor happily propagates but that no runner can
      # satisfy fails here rather than the first time somebody deploys.
      - name: Every employee runs against its fixture
        run: python scripts/run_all_employees.py --apply

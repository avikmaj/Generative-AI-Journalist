name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  skills:
    name: Validate skill packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate skills
        run: python3 scripts/validate_skills.py

      - name: Validate golden set
        run: python3 scripts/check_golden_set.py

      - name: Build all three platform bundles
        run: |
          python3 scripts/build_claude_bundle.py
          python3 scripts/build_chatgpt_bundle.py
          python3 scripts/build_grok_bundle.py

      - name: Check no licensed material reached a bundle
        run: |
          set -e
          if find dist -name "*.pdf" | grep -q .; then
            echo "ERROR a PDF reached dist/ - licensed corpora must never be bundled"
            exit 1
          fi
          for pattern in "outskill/raw" "business/raw" "index.jsonl" "Business_Management_Bible"; do
            if find dist -path "*$pattern*" | grep -q .; then
              echo "ERROR licensed material reached dist/: $pattern"
              exit 1
            fi
          done
          echo "bundles are clean"

      - name: Check no licensed corpus was committed
        run: |
          set -e
          fail=0
          for path in \
            knowledge/outskill/raw \
            knowledge/outskill/index.jsonl \
            knowledge/business/raw \
            knowledge/business/Business_Management_Bible.md
          do
            if git ls-files --error-unmatch "$path" > /dev/null 2>&1; then
              echo "ERROR licensed material is tracked: $path"
              fail=1
            fi
          done
          exit $fail
